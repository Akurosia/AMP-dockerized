name: "Deploy Production"

on:
  push:
    branches:
      - "master"
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: e.g. v22

permissions:
  contents: read
  packages: write

concurrency:
  group: production-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build.yml
    with:
      for_deploy: true
    secrets: inherit

  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE: ghcr.io/akurosia/amp-dockerized
    steps:
      - name: "Download Digest Artifacts"
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
      - name: "Get Tag Name"
        id: get_tag_name
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME=$(jq -r '.inputs.tag // empty' "$GITHUB_EVENT_PATH")
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="sha-${GITHUB_SHA:0:12}"
          fi
          if [[ ! "$TAG_NAME" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid container tag"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Deploy Tags and Multi-Arch Manifests"
        env:
          TAG_NAME: ${{ steps.get_tag_name.outputs.TAG_NAME }}
        run: |
          # The build workflow pushed the per-arch images by digest; assemble
          # them into tags and manifests without pulling any image data.
          REFS=""
          for d in /tmp/digests/digests-*/*; do
            ARCH=$(basename $(dirname ${d}) | sed 's/^digests-//')
            DIGEST=$(basename ${d})
            REFS="${REFS} ${IMAGE}@sha256:${DIGEST}"
            # Arch-specific tag, e.g. :v27-amd64
            docker buildx imagetools create -t "${IMAGE}:${TAG_NAME}-${ARCH}" "${IMAGE}@sha256:${DIGEST}"
          done
          docker buildx imagetools create -t "${IMAGE}:${TAG_NAME}" -t "${IMAGE}:latest" ${REFS}
          docker buildx imagetools inspect "${IMAGE}:${TAG_NAME}"
