name: Build and publish AMP 3
on:
  push:
    branches: [master]
    paths:
      - 'entrypoint/**'
      - Dockerfile
      - '.dockerignore'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'entrypoint/**'
      - Dockerfile
      - '.dockerignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish AMP 3 images
        type: boolean
        default: true
  schedule:
    - cron: '35 5 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: amp3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stream: [preview, mainline]
    steps:
      - uses: actions/checkout@v6
      - name: Validate scripts
        run: |
          set -e
          for script in entrypoint/*.sh examples/*.sh; do bash -n "$script"; done
          python3 -m py_compile entrypoint/*.py
      - name: Check signed upstream package availability
        id: upstream
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl -fsSL --retry 3 https://cdn-repo.c7rs.com/amp3/archive.gpg -o "$work/archive.gpg"
          url="https://cdn-repo.c7rs.com/amp3/deb/dists/$STREAM/InRelease"
          status=$(curl -sSL --retry 3 -o "$work/InRelease" -w '%{http_code}' "$url")
          if [[ "$STREAM" == mainline && "$status" == 404 ]]; then
            echo "::notice::Mainline repository is not available yet."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == 200 ]] || { echo "::error::Unexpected repository HTTP status $status"; exit 1; }
          gpgv --keyring "$work/archive.gpg" "$work/InRelease"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.upstream.outputs.available == 'true'
      - name: Build AMP 3
        if: steps.upstream.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: amp3-local:test
          build-args: |
            AMP3_STREAM=${{ matrix.stream }}
            AMP3_PACKAGE_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=amp3-${{ matrix.stream }}
          cache-to: type=gha,scope=amp3-${{ matrix.stream }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify runtime files
        if: steps.upstream.outputs.available == 'true'
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          docker run --rm --env EXPECTED_STREAM="$STREAM" --entrypoint /bin/bash amp3-local:test -ec '
            cat /usr/local/share/amp3-docker/package-version
            test "$(cat /usr/local/share/amp3-docker/package-stream)" = "$EXPECTED_STREAM"
            test -x /opt/cubecoders/amp3/amp3-host
            test -x /sbin/init
            test -d /opt/cubecoders/amp3/seed
            for unit in amp3 amp3-bus amp3-sysagent; do
              test -f "/usr/lib/systemd/system/$unit.service"
            done
          '
      - name: Login to GHCR
        if: steps.upstream.outputs.available == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMP 3 stream
        if: steps.upstream.outputs.available == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          STREAM: ${{ matrix.stream }}
        run: |
          set -euo pipefail
          image=ghcr.io/akurosia/amp-dockerized
          tags=("$STREAM" "$STREAM-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [[ "$STREAM" == preview ]]; then
            tags+=(amp3 amp3-amd64 "amp3-${GITHUB_SHA:0:12}" "sha-${GITHUB_SHA:0:12}")
          else
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            docker tag amp3-local:test "$image:$tag"
            docker push "$image:$tag"
          done
