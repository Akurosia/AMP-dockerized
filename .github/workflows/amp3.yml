name: Build and publish AMP 3
on:
  push:
    branches: [master]
    paths:
      - 'amp3/**'
      - '.github/workflows/amp3.yml'
  pull_request:
    paths:
      - 'amp3/**'
      - '.github/workflows/amp3.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish AMP 3 image
        type: boolean
        default: true
  schedule:
    - cron: '35 5 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: amp3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          for script in amp3/entrypoint/*.sh amp3/examples/*.sh; do bash -n "$script"; done
          python3 -m py_compile amp3/entrypoint/*.py
      - uses: docker/setup-buildx-action@v3
      - name: Build AMP 3
        uses: docker/build-push-action@v6
        with:
          context: ./amp3
          platforms: linux/amd64
          pull: true
          load: true
          tags: amp3-local:test
          build-args: |
            AMP3_PACKAGE_CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha,scope=amp3
          cache-to: type=gha,scope=amp3,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify runtime files
        run: |
          docker run --rm --entrypoint /bin/bash amp3-local:test -ec '
            cat /usr/local/share/amp3-docker/package-version
            test -x /opt/cubecoders/amp3/amp3-host
            test -x /sbin/init
            test -d /opt/cubecoders/amp3/seed
            for unit in amp3 amp3-bus amp3-sysagent; do
              test -f "/usr/lib/systemd/system/$unit.service"
            done
          '
      - name: Login to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMP 3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          image=ghcr.io/akurosia/amp-dockerized
          for tag in amp3 amp3-amd64 "amp3-${GITHUB_SHA:0:12}"; do
            docker tag amp3-local:test "$image:$tag"
            docker push "$image:$tag"
          done
