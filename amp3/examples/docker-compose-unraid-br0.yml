# AMP 3 beta: use a new data directory, not the AMP 2 volume.
# Stop the old container before reusing its IP/MAC address.
# Requires a trusted Linux host; writable host cgroups and elevated capabilities.
services:
  AMP:
    container_name: AMP
    image: ghcr.io/akurosia/amp-dockerized:amp3
    platform: linux/amd64
    cgroup: host
    tty: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /run
      - /run/lock
    environment:
      PORT: "8443"
      TZ: Europe/Berlin
    volumes:
      - /mnt/user/appdata/amp3:/opt/cubecoders/amp3/data:rw
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    shm_size: 1gb
    stop_grace_period: 2m
    restart: unless-stopped
    networks:
      br0:
        ipv4_address: 192.168.2.200
        mac_address: "AA:BB:CC:DD:EE:FF" # Replace with your unique persistent MAC.

networks:
  br0:
    external: true

# Panel: http://192.168.2.200:8443
# Complete setup and licensing in the web wizard using the private setup link.
# No Docker socket is needed for native AMP 3 game servers.
